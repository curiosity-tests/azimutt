name: "👾 Azimutt CI"
run-name: "👾 Azimutt CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches-ignore:
      - refs/tags/*
  pull_request:
    types: [open]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  cancel:
    name: "❌ Cancel Previous Runs"
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.10.0
        with:
          access_token: ${{ github.token }}
  test:
    name: "🛠 Build and test"
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        elixir: [ '1.14' ]
        otp: [ '25' ]
    services:
      db:
        image: postgres:14
        ports: [ '5432:5432' ]
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get deps cache
        uses: actions/cache@v4
        with:
          path: deps/
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}

      - name: Get build cache
        uses: actions/cache@v4
        with:
          path: _build/test/
          key: build-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}

      - name: Setup elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0+sha256.dbdf5961c32909fb030595a9daa1dae720162e658609a8f92f2fa99835510ca5

      - name: Install Dependencies
        env: # needs env for `mix ecto.setup`
          PHX_HOST: localhost
          PORT: 4000
          FILE_STORAGE_ADAPTER: local
        run: npm run setup

      - name: Check build
        run: npm run build

      - name: Check format
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: npm run format

      - name: Check lint
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: npm run lint

      - name: Run tests
        env:
          PHX_HOST: localhost
          PORT: 4000
          FILE_STORAGE_ADAPTER: local
        run: npm test
